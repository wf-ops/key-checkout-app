<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KRB Keys</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4caf50;
      --primary-dark: #388e3c;
      --red: #e53935;
      --orange: #f57c00;
      --surface: #ffffff;
      --bg: #f5f5f5;
      --border: #e0e0e0;
      --gray-400: #bdbdbd;
      --gray-600: #757575;
      --gray-900: #212121;
      --nav-h: 60px;
      --header-h: 52px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1e1e1e;
        --bg: #121212;
        --border: #333;
        --gray-400: #666;
        --gray-600: #aaa;
        --gray-900: #f0f0f0;
      }
    }
    html, body { height: 100%; background: var(--bg); color: var(--gray-900); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; }
    body { padding-top: var(--header-h); padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); overflow-x: hidden; }

    /* Header */
    .app-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: #1a1a2e; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100; }
    .app-header .logo { display: flex; align-items: center; gap: 8px; }
    .app-header .logo img { height: 28px; }
    .app-header .logo span { font-size: .85rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
    .user-pill { background: rgba(255,255,255,.12); border: none; color: #fff; border-radius: 20px; padding: 4px 12px; font-size: .78rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .role-badge { background: var(--primary); border-radius: 4px; padding: 1px 5px; font-size: .68rem; font-weight: 700; letter-spacing: .3px; }

    /* Bottom Nav */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: stretch; z-index: 100; }
    .nav-btn { flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .65rem; color: var(--gray-600); padding: 0; transition: color .15s; }
    .nav-btn.active { color: var(--primary); }
    .nav-icon { font-size: 1.4rem; line-height: 1; }

    /* More Sheet */
    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: none; }
    .sheet-overlay.open { display: block; }
    .bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 16px 16px 0 0; z-index: 201; padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease; }
    .bottom-sheet.open { transform: none; }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
    .sheet-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; font-size: .95rem; cursor: pointer; border: none; background: none; color: var(--gray-900); width: 100%; text-align: left; }
    .sheet-item:hover { background: var(--bg); }
    .sheet-item .sheet-icon { font-size: 1.3rem; width: 28px; text-align: center; }
    .sheet-divider { height: 1px; background: var(--border); margin: 4px 0; }

    /* Tabs */
    .tab { display: none; padding: 16px; }
    .tab.active { display: block; }

    /* Cards */
    .card { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h3 { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--gray-600); margin-bottom: 12px; }

    /* Spinner */
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; margin: 40px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    .empty { text-align: center; color: var(--gray-400); padding: 32px 16px; font-size: .9rem; }

    /* Search */
    .search-box { position: relative; margin-bottom: 12px; }
    .search-box input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--gray-900); font-size: .95rem; outline: none; }
    .search-box input:focus { border-color: var(--primary); }
    .search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; max-height: 220px; overflow-y: auto; z-index: 50; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .search-result-item { padding: 10px 14px; cursor: pointer; font-size: .9rem; border-bottom: 1px solid var(--border); }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--bg); }
    .result-code { font-size: .75rem; color: var(--gray-600); margin-top: 2px; }
    .selected-prop { display: flex; align-items: center; justify-content: space-between; background: #e8f5e9; border: 1px solid #a5d6a7; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: .9rem; font-weight: 600; }
    .selected-prop button { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--gray-600); padding: 0 4px; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: .9rem; font-weight: 600; transition: background .15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--gray-900); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-full { width: 100%; }

    /* Form */
    label { display: block; font-size: .8rem; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; margin-top: 12px; }
    input[type=text], input[type=password], input[type=date], select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--gray-900); font-size: .9rem; outline: none; font-family: inherit; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    /* Login */
    #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 300; }
    .login-card { background: var(--surface); border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,.12); }
    .login-card h2 { font-size: 1.3rem; margin-bottom: 4px; }
    .login-card p { font-size: .85rem; color: var(--gray-600); margin-bottom: 20px; }

    /* Dashboard */
    .checkout-card { background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid var(--orange); }
    .checkout-card h4 { font-size: .9rem; font-weight: 700; margin-bottom: 4px; }
    .checkout-card .meta { font-size: .78rem; color: var(--gray-600); }
    .checkout-card .overdue { color: var(--red); font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: .72rem; font-weight: 700; }
    .badge-orange { background: #fff3e0; color: var(--orange); }
    .badge-red { background: #ffebee; color: var(--red); }

    /* Keys */
    .key-row { display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px; }
    .key-btn { flex: 1; background: var(--bg); border: 2px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, background .15s; }
    .key-btn.selected { border-color: var(--primary); background: #e8f5e9; }
    .key-tag-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--gray-600); }
    .key-num { font-size: 1.2rem; font-weight: 800; }
    .key-type { font-size: .75rem; color: var(--gray-600); }
    .key-cut { font-size: .75rem; color: #1565c0; font-family: monospace; font-weight: 600; }
    .key-missing-btn { background: none; border: 1px solid var(--red); color: var(--red); border-radius: 8px; padding: 0 10px; font-size: .75rem; cursor: pointer; white-space: nowrap; }

    /* Checkin cards */
    .log-card { background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid var(--primary); }
    .log-card h4 { font-size: .9rem; font-weight: 700; margin-bottom: 4px; }
    .log-card .meta { font-size: .78rem; color: var(--gray-600); }

    /* Codes tab */
    .codes-card { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .codes-card h4 { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--gray-600); margin-bottom: 12px; }
    .code-row { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); gap: 8px; }
    .code-row:last-child { border-bottom: none; }
    .code-label { font-size: .85rem; color: var(--gray-600); flex: 1; min-width: 0; }
    .code-value { font-size: 1rem; font-weight: 700; font-family: monospace; color: var(--gray-900); text-align: right; }
    .code-value.empty { color: var(--gray-400); font-weight: 400; font-family: inherit; font-size: .85rem; }
    .code-edit-btn { background: none; border: none; cursor: pointer; font-size: .85rem; padding: 2px 4px; opacity: .45; flex-shrink: 0; line-height: 1; }
    .code-edit-btn:hover { opacity: 1; }
    .key-tag-cut-row { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .key-tag-card { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .key-tag-card:last-child { border-bottom: none; }
    .key-tag-num { font-size: 1.1rem; font-weight: 800; min-width: 56px; flex-shrink: 0; }
    .key-tag-info { flex: 1; min-width: 0; }
    .key-tag-types { font-size: .8rem; color: var(--gray-600); }
    .key-tag-cut { font-size: .82rem; color: #1565c0; font-family: monospace; font-weight: 600; }
    .key-tag-status { font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 12px; flex-shrink: 0; }
    .key-tag-status.in { background: #e8f5e9; color: #2e7d32; }
    .key-tag-status.out { background: #fff3e0; color: #e65100; }
    .key-tag-status.missing { background: #ffebee; color: #c62828; }

    /* Users */
    .user-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .user-row:last-child { border-bottom: none; }
    .user-name { font-weight: 600; font-size: .9rem; }
    .user-meta { font-size: .78rem; color: var(--gray-600); }
    .user-actions { margin-left: auto; display: flex; gap: 6px; }

    /* Lockboxes */
    .lockbox-card { background: var(--surface); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .lockbox-sn { font-weight: 700; font-size: .95rem; min-width: 80px; }
    .lockbox-meta { flex: 1; font-size: .8rem; color: var(--gray-600); }
    .lockbox-status { font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
    .lockbox-status.deployed { background: #e8f5e9; color: #2e7d32; }
    .lockbox-status.available { background: #e3f2fd; color: #1565c0; }
    .lockbox-status.unassigned { background: var(--bg); color: var(--gray-600); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: var(--surface); border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
    .modal h3 { font-size: 1.05rem; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; }
    .photo-preview { width: 100%; max-height: 160px; object-fit: cover; border-radius: 8px; margin-top: 8px; }
  </style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <h2>KRB Key Manager</h2>
    <p>Sign in to continue</p>
    <label>Username
      <input type="text" id="login-username" autocomplete="username" autocapitalize="none" placeholder="username" />
    </label>
    <label>PIN
      <input type="password" id="login-pin" autocomplete="current-password" inputmode="numeric" placeholder="••••" />
    </label>
    <div id="login-error" style="color:var(--red);font-size:.85rem;margin-top:8px;display:none"></div>
    <button class="btn btn-primary btn-full" style="margin-top:16px" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- App Header -->
<header class="app-header" id="app-header" style="display:none">
  <div class="logo">
    <img src="/keyrenter-logo.png" alt="Keyrenter" onerror="this.style.display='none'" />
    <span>Key Manager</span>
  </div>
  <button class="user-pill" id="user-pill" onclick="openMoreSheet()">
    <span id="user-name-display"></span>
    <span class="role-badge" id="user-role-display"></span>
  </button>
</header>

<!-- More Bottom Sheet -->
<div class="sheet-overlay" id="more-overlay" onclick="closeMoreSheet()"></div>
<div class="bottom-sheet" id="more-sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-item" id="sheet-lockboxes" onclick="closeMoreSheet();showTab('lockboxes')" style="display:none">
    <span class="sheet-icon">🔒</span> Lockboxes
  </button>
  <button class="sheet-item" id="sheet-users" onclick="closeMoreSheet();showTab('users')" style="display:none">
    <span class="sheet-icon">👥</span> Users
  </button>
  <div class="sheet-divider" id="sheet-divider" style="display:none"></div>
  <button class="sheet-item" onclick="closeMoreSheet();showChangePinModal()">
    <span class="sheet-icon">🔐</span> Change PIN
  </button>
  <button class="sheet-item" onclick="closeMoreSheet();doLogout()" style="color:var(--red)">
    <span class="sheet-icon">🚪</span> Sign Out
  </button>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav" id="bottom-nav" style="display:none">
  <button class="nav-btn active" data-tab="dashboard" onclick="showTab('dashboard')">
    <span class="nav-icon">🏠</span>Home
  </button>
  <button class="nav-btn" data-tab="checkout" onclick="showTab('checkout')">
    <span class="nav-icon">📤</span>Out
  </button>
  <button class="nav-btn" data-tab="checkin" onclick="showTab('checkin')">
    <span class="nav-icon">📥</span>In
  </button>
  <button class="nav-btn" data-tab="codes" onclick="showTab('codes')">
    <span class="nav-icon">🔑</span>Codes
  </button>
  <button class="nav-btn" id="more-nav-btn" onclick="openMoreSheet()">
    <span class="nav-icon">☰</span>More
  </button>
</nav>

<!-- Dashboard Tab -->
<div id="tab-dashboard" class="tab active">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <h2 style="font-size:1.1rem">Keys Out</h2>
    <button class="btn btn-outline" style="padding:6px 12px;font-size:.8rem" onclick="loadDashboard()">Refresh</button>
  </div>
  <div id="dashboard-content"><div class="spinner"></div></div>
</div>

<!-- Check Out Tab -->
<div id="tab-checkout" class="tab">
  <h2 style="font-size:1.1rem;margin-bottom:12px">Check Out Key</h2>
  <div class="search-box">
    <input type="text" id="prop-input" placeholder="Search property or code..." autocomplete="off" />
    <div class="search-results" id="prop-results"></div>
  </div>
  <div id="selected-prop-display" style="display:none"></div>
  <div id="checkout-keys"></div>
  <div id="checkout-form" style="display:none">
    <div class="card" style="margin-top:8px">
      <label>Purpose
        <select id="co-purpose">
          <option>Tenant Move-In</option>
          <option>Tenant Move-Out</option>
          <option>Maintenance</option>
          <option>Showing</option>
          <option>Inspection</option>
          <option>Other</option>
        </select>
      </label>
      <label>Check-Out Date
        <input type="date" id="co-date-out" />
      </label>
      <label>Due Back
        <input type="date" id="co-date-due" />
      </label>
      <label>Photo (optional)
        <input type="file" id="co-photo" accept="image/*" capture="environment" onchange="previewPhoto(this,'co-photo-preview')" />
        <img id="co-photo-preview" class="photo-preview" style="display:none" />
      </label>
      <button class="btn btn-primary btn-full" style="margin-top:14px" onclick="submitCheckout()">Confirm Check Out</button>
    </div>
  </div>
</div>

<!-- Check In Tab -->
<div id="tab-checkin" class="tab">
  <h2 style="font-size:1.1rem;margin-bottom:12px">Check In Key</h2>
  <div id="checkin-content"><div class="spinner"></div></div>
</div>

<!-- Codes Tab -->
<div id="tab-codes" class="tab">
  <h2 style="font-size:1.1rem;margin-bottom:12px">Codes &amp; Access</h2>
  <div class="search-box">
    <input type="text" id="codes-prop-input" placeholder="Search property or code..." autocomplete="off" />
    <div class="search-results" id="codes-prop-results"></div>
  </div>
  <div id="codes-selected-prop" style="display:none"></div>
  <div id="codes-content"></div>
</div>

<!-- Lockboxes Tab -->
<div id="tab-lockboxes" class="tab">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <h2 style="font-size:1.1rem">Lockboxes</h2>
    <button class="btn btn-outline" style="padding:6px 12px;font-size:.8rem" onclick="loadLockboxes()">Refresh</button>
  </div>
  <div id="lockboxes-content"><div class="spinner"></div></div>
</div>

<!-- Users Tab -->
<div id="tab-users" class="tab">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <h2 style="font-size:1.1rem">Users</h2>
    <button class="btn btn-primary" style="padding:6px 14px;font-size:.8rem" onclick="showAddUserModal()">+ Add</button>
  </div>
  <div id="users-content"><div class="spinner"></div></div>
</div>

<!-- Change PIN Modal -->
<div class="modal-overlay" id="change-pin-modal" style="display:none">
  <div class="modal">
    <h3>Change PIN</h3>
    <label>Current PIN <input type="password" id="cp-current" inputmode="numeric" /></label>
    <label>New PIN <input type="password" id="cp-new" inputmode="numeric" /></label>
    <label>Confirm New PIN <input type="password" id="cp-confirm" inputmode="numeric" /></label>
    <div id="cp-error" style="color:var(--red);font-size:.85rem;margin-top:8px;display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="document.getElementById('change-pin-modal').style.display='none'">Cancel</button>
      <button class="btn btn-primary" onclick="submitChangePin()">Save</button>
    </div>
  </div>
</div>

<!-- Add/Edit User Modal -->
<div class="modal-overlay" id="user-modal" style="display:none">
  <div class="modal">
    <h3 id="user-modal-title">Add User</h3>
    <input type="hidden" id="um-id" />
    <label>Name <input type="text" id="um-name" /></label>
    <label>Username <input type="text" id="um-username" autocapitalize="none" /></label>
    <label>PIN <input type="password" id="um-pin" inputmode="numeric" placeholder="leave blank to keep" /></label>
    <label>Role
      <select id="um-role">
        <option>Member</option>
        <option>Manager</option>
        <option>Admin</option>
      </select>
    </label>
    <label>Notion Person ID <input type="text" id="um-notion-id" placeholder="optional" /></label>
    <div id="um-error" style="color:var(--red);font-size:.85rem;margin-top:8px;display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="document.getElementById('user-modal').style.display='none'">Cancel</button>
      <button class="btn btn-primary" onclick="submitUserModal()">Save</button>
    </div>
  </div>
</div>

<!-- Lockbox Code Modal -->
<div class="modal-overlay" id="lockbox-code-modal" style="display:none">
  <div class="modal">
    <h3>Generate Day Code</h3>
    <p id="lockbox-code-sn" style="font-size:.85rem;color:var(--gray-600);margin-bottom:12px"></p>
    <label>Date
      <input type="date" id="lc-date" />
    </label>
    <div id="lc-result" style="margin-top:12px;display:none">
      <div style="font-size:.8rem;color:var(--gray-600);margin-bottom:4px">Day Code</div>
      <div id="lc-code" style="font-size:2rem;font-weight:800;font-family:monospace;letter-spacing:4px;color:var(--primary)"></div>
    </div>
    <div id="lc-error" style="color:var(--red);font-size:.85rem;margin-top:8px;display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="document.getElementById('lockbox-code-modal').style.display='none'">Close</button>
      <button class="btn btn-primary" onclick="generateLockboxCode()">Generate</button>
    </div>
  </div>
</div>

<script>
let currentUser = null;
window.currentUser = null;

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts,
  });
  if (res.status === 401) { showLogin(); throw new Error('Not authenticated'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-header').style.display = 'none';
  document.getElementById('bottom-nav').style.display = 'none';
  currentUser = null;
  window.currentUser = null;
}

async function initAuth() {
  try {
    currentUser = await api('/api/me');
    window.currentUser = currentUser;
    onLogin(currentUser);
  } catch (_) {
    showLogin();
  }
}

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const pin = document.getElementById('login-pin').value.trim();
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  try {

    currentUser = res.user;
    window.currentUser = currentUser;
    onLogin(currentUser);
  } catch (e) {

    err.style.display = 'block';

function onLogin(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-header').style.display = 'flex';
  document.getElementById('bottom-nav').style.display = 'flex';
  document.getElementById('user-name-display').textContent = user.name;

async function doLogout() {

}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('tab-' + tab);
  if (el) el.classList.add('active');
  const btn = document.querySelector(`.nav-btn[data-tab="${tab}"]`);
  if (btn) btn.classList.add('active');
  if (tab === 'checkin') loadCheckin();
  if (tab === 'lockboxes') loadLockboxes();
  if (tab === 'users') loadUsers();
}

// Dashboard
async function loadDashboard() {
  const el = document.getElementById('dashboard-content');
  el.innerHTML = '<div class="spinner"></div>';
  try {
    const entries = await api('/api/dashboard');
    if (entries.length === 0) { el.innerHTML = '<div class="empty">No keys currently checked out</div>'; return; }
    const today = new Date().toISOString().slice(0, 10);
    el.innerHTML = entries.map(e => {
      const due = e.dateDue || e.dateOut;
      const overdue = due && due < today;
      return `<div class="checkout-card">
        <h4>${e.logEntry}</h4>
        <div class="meta">
          Out: ${e.dateOut || '?'} &nbsp;|&nbsp;
          ${overdue
            ? `<span class="overdue">Due: ${due} (OVERDUE)</span>`
            : `Due: ${due || '?'}`}
          ${e.purpose ? `&nbsp;|&nbsp; ${e.purpose}` : ''}
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = `<div class="empty">Error: ${e.message}</div>`;
  }
}

function canEditCodes() {

function codeRow(label, field, value) {

function renderCodes(data) {
  const el = document.getElementById('codes-content');
  let html = `<div class="codes-card"><h4>Entry Codes</h4>${codeRow('Front Door','frontDoorCode',data.frontDoorCode)}${codeRow('Garage Keypad','garageKeypad',data.garageKeypad)}${codeRow('Community Entry','communityEntryCode',data.communityEntryCode)}</div>`;
  html += `<div class="codes-card"><h4>Mailbox</h4>${codeRow('Box #','mailboxNumber',data.mailboxNumber)}${codeRow('Location','mailboxLocation',data.mailboxLocation)}</div>`;
  const osEdit = canEditCodes() ? `<button class="code-edit-btn" onclick="editCodeField('otherSystems',${JSON.stringify(data.otherSystems||'')},'Other Systems')" style="display:block;margin-top:4px" title="Edit">✏️</button>` : '';
  html += `<div class="codes-card"><h4>Other Systems</h4>${data.otherSystems ? `<div style="font-size:.9rem;line-height:1.5;white-space:pre-wrap">${data.otherSystems}</div>` : '<span style="color:var(--gray-400);font-size:.9rem">—</span>'}${osEdit}</div>`;
  if (data.keys && data.keys.length > 0) {
    const sc = s => s === 'In Office' ? 'in' : s === 'Missing' ? 'missing' : 'out';
    const sl = s => s === 'In Office' ? 'In Office' : s === 'Checked Out' ? 'Out' : s || 'In Office';

      const cutEdit = canEditCodes() ? `<button class="code-edit-btn" onclick="editKwiksetCut('${k.id}',${JSON.stringify(k.kwiksetCut||'')})" title="Edit cut">✏️</button>` : '';

        </div>
        <span class="key-tag-status ${sc(k.status)}">${sl(k.status)}</span>
      </div>`;
    }).join('')}</div>`;
  }
  const mnEdit = canEditCodes() ? `<button class="code-edit-btn" onclick="editCodeField('maintenanceNotes',${JSON.stringify(data.maintenanceNotes||'')},'Maintenance Notes')" style="display:block;margin-top:4px" title="Edit">✏️</button>` : '';

async function editCodeField(field, currentValue, label) {
  if (!codesCurrentPropertyId) return;
  showEditModal(label, currentValue, async (newVal) => {

      await api(`/api/property-codes/${codesCurrentPropertyId}`, { method: 'PATCH', body: JSON.stringify({ field, value: newVal }) });

      renderCodes(data);
    } catch (e) { alert('Save failed: ' + e.message); }
  });
}
async function editKwiksetCut(keyId, currentValue) {
  showEditModal('Kwikset Cut Code', currentValue, async (newVal) => {
    try {
      await api(`/api/keys/${keyId}`, { method: 'PATCH', body: JSON.stringify({ kwiksetCut: newVal }) });
      const data = await api(`/api/property-codes/${codesCurrentPropertyId}`);
      renderCodes(data);
    } catch (e) { alert('Save failed: ' + e.message); }
  });
}
function showEditModal(label, currentValue, onSave) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  const isMultiline = label === 'Other Systems' || label === 'Maintenance Notes';
  overlay.innerHTML = `<div style="background:var(--surface);border-radius:12px;padding:20px;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.2)">
    <h4 style="margin:0 0 12px;font-size:1rem">Edit ${label}</h4>
    ${isMultiline
      ? `<textarea id="edit-modal-input" style="width:100%;min-height:80px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:.95rem;resize:vertical;box-sizing:border-box"></textarea>`
      : `<input id="edit-modal-input" type="text" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:.95rem;box-sizing:border-box">`}
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
      <button onclick="this.closest('[style*=fixed]').remove()" style="padding:8px 16px;border:1px solid var(--border);background:transparent;border-radius:6px;cursor:pointer">Cancel</button>
      <button id="edit-modal-save" style="padding:8px 16px;background:var(--primary);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600">Save</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const input = document.getElementById('edit-modal-input');
  input.value = currentValue || '';
  input.focus();
  if (input.tagName === 'INPUT') input.select();
  document.getElementById('edit-modal-save').onclick = async () => {
    const val = input.value.trim();
    overlay.remove();
    await onSave(val);
  };
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

function selectKey(el) {

async function promptMissing(keyId, slot, btn) {
  if (!confirm(`Mark Key Tag #${slot} as Missing?`)) return;
  try {
    btn.disabled = true;
    await api('/api/mark-missing', { method: 'POST', body: JSON.stringify({ keyId }) });
    btn.closest('.key-row').remove();
  } catch (e) { alert(e.message); btn.disabled = false; }
}
async function submitCheckout() {
  if (!selectedProperty || !selectedKey) return alert('Select a property and key first');
  const purpose = document.getElementById('co-purpose').value;
  const dateOut = document.getElementById('co-date-out').value;
  const dateDue = document.getElementById('co-date-due').value;
  if (!dateOut || !dateDue) return alert('Please fill in dates');
  const form = new FormData();
  form.append('keyId', selectedKey.id);
  form.append('keySlot', selectedKey.slot);
  form.append('staffId', currentUser.notionPersonId || currentUser.id);
  form.append('staffName', currentUser.name);
  form.append('purpose', purpose);
  form.append('dateOut', dateOut);
  form.append('dateDue', dateDue);
  form.append('propertyId', selectedProperty.id);
  form.append('propertyUrl', selectedProperty.url);
  form.append('existingLogRelation', JSON.stringify(selectedKey.logRelation || []));
  const photo = document.getElementById('co-photo').files[0];
  if (photo) form.append('photo', photo);
  const btn = event.target;
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await fetch('/api/checkout', { method: 'POST', body: form }).then(async r => {
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Checkout failed');
      return d;
    });
    clearProperty();
    showTab('dashboard');
    loadDashboard();
  } catch (e) { alert(e.message); }
  finally { btn.disabled = false; btn.textContent = 'Confirm Check Out'; }
}
function previewPhoto(input, previewId) {
  const file = input.files[0];
  const preview = document.getElementById(previewId);
  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }
}

  el.innerHTML = '<div class="spinner"></div>';
  try {
    const boxes = await api('/api/lockboxes');
    if (boxes.length === 0) { el.innerHTML = '<div class="empty">No lockboxes found</div>'; return; }
    el.innerHTML = boxes.map(b => {
      const statusClass = b.status === 'Deployed' ? 'deployed' : b.status === 'Available' ? 'available' : 'unassigned';
      return `<div class="lockbox-card">
        <div class="lockbox-sn">SN: ${b.sn}${b.krbBox ? ` / Box #${b.krbBox}` : ''}</div>
        <div class="lockbox-meta">${b.propertyName || 'Unassigned'}${b.notes ? '<br>' + b.notes : ''}</div>
        <span class="lockbox-status ${statusClass}">${b.status}</span>
        <button class="btn btn-outline" style="padding:4px 10px;font-size:.75rem" onclick="openLockboxCode('${b.sn}')">Code</button>
      </div>`;
    }).join('');
  } catch (e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}
function openLockboxCode(sn) {
  currentLockboxSN = sn;
  document.getElementById('lockbox-code-sn').textContent = `Serial: ${sn}`;
  document.getElementById('lc-date').value = new Date().toISOString().slice(0, 10);
  document.getElementById('lc-result').style.display = 'none';
  document.getElementById('lc-error').style.display = 'none';
  document.getElementById('lockbox-code-modal').style.display = 'flex';
}
async function generateLockboxCode() {
  const date = document.getElementById('lc-date').value;
  if (!date) return alert('Select a date');
  const errEl = document.getElementById('lc-error');
  errEl.style.display = 'none';
  document.getElementById('lc-result').style.display = 'none';
  try {
    const data = await api('/api/lockboxes/generate-code', {
      method: 'POST',
      body: JSON.stringify({ serialNumber: currentLockboxSN, date }),
    });
    document.getElementById('lc-code').textContent = data.DayCode || data.dayCode || JSON.stringify(data);
    document.getElementById('lc-result').style.display = 'block';
  } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-pin').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  document.getElementById('login-username').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('login-pin').focus(); });
  initAuth();
});
</script>
