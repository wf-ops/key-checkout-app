<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KRB Keys</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #4caf50;
      --primary-dark: #388e3c;
      --red: #e53935;
      --orange: #f57c00;
      --surface: #ffffff;
      --surface-alt: #f5f5f5;
      --bg: #f0f0f0;
      --border: #e0e0e0;
      --gray-400: #bdbdbd;
      --gray-600: #757575;
      --gray-900: #212121;
      --nav-h: 60px;
      --header-h: 52px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary: #66bb6a;
        --primary-dark: #4caf50;
        --surface: #1c1c1e;
        --surface-alt: #2c2c2e;
        --bg: #111113;
        --border: #38383a;
        --gray-400: #636366;
        --gray-600: #98989d;
        --gray-900: #f2f2f7;
      }
    }
    html { height: 100%; }
    body { min-height: 100%; background: var(--bg); color: var(--gray-900); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 16px; padding-top: var(--header-h); padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); overflow-x: hidden; }

    .app-header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); background: #1a1a2e; color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100; }
    .app-header .logo { display: flex; align-items: center; gap: 8px; }
    .app-header .logo img { height: 28px; }
    .app-header .logo span { font-size: .85rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
    .user-pill { background: rgba(255,255,255,.12); border: none; color: #fff; border-radius: 20px; padding: 4px 12px; font-size: .78rem; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .role-badge { background: var(--primary); border-radius: 4px; padding: 1px 5px; font-size: .68rem; font-weight: 700; letter-spacing: .3px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: stretch; z-index: 100; }
    .nav-btn { flex: 1; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: .65rem; color: var(--gray-600); padding: 0; transition: color .15s; }
    .nav-btn.active { color: var(--primary); }
    .nav-icon { font-size: 1.4rem; line-height: 1; }

    .sheet-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200; display: none; }
    .sheet-overlay.open { display: block; }
    .bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 16px 16px 0 0; z-index: 201; padding: 12px 0 calc(16px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease; }
    .bottom-sheet.open { transform: none; }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
    .sheet-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; font-size: .95rem; cursor: pointer; border: none; background: none; color: var(--gray-900); width: 100%; text-align: left; }
    .sheet-item:hover { background: var(--bg); }
    .sheet-item .sheet-icon { font-size: 1.3rem; width: 28px; text-align: center; }
    .sheet-divider { height: 1px; background: var(--border); margin: 4px 0; }

    .tab { display: none; padding: 12px; max-width: 560px; margin: 0 auto; }
    .tab.active { display: block; }
    .card { background: var(--surface); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h3 { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--gray-600); margin-bottom: 10px; }

    .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; margin: 32px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty { text-align: center; color: var(--gray-400); padding: 24px 16px; font-size: .9rem; }

    .search-box { position: relative; margin-bottom: 10px; }
    .search-box input { width: 100%; padding: 9px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--gray-900); font-size: .95rem; outline: none; }
    .search-box input:focus { border-color: var(--primary); }
    .search-results { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; max-height: 220px; overflow-y: auto; z-index: 50; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .search-result-item { padding: 9px 14px; cursor: pointer; font-size: .9rem; border-bottom: 1px solid var(--border); }
    .search-result-item:last-child { border-bottom: none; }
    .search-result-item:hover { background: var(--bg); }
    .result-code { font-size: .75rem; color: var(--gray-600); margin-top: 2px; }
    .selected-prop { display: flex; align-items: center; justify-content: space-between; background: color-mix(in srgb, var(--primary) 12%, transparent); border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent); border-radius: 8px; padding: 7px 12px; margin-bottom: 10px; font-size: .9rem; font-weight: 600; }
    .selected-prop button { background: none; border: none; cursor: pointer; font-size: 1rem; color: var(--gray-600); padding: 0 4px; }
    .codes-prop-label { background: color-mix(in srgb, var(--primary) 12%, transparent); border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent); border-radius: 8px; padding: 7px 12px; margin-bottom: 10px; font-size: .9rem; font-weight: 600; display: none; }

    .login-user-list { border: 1px solid var(--border); border-radius: 8px; margin-top: 4px; overflow: hidden; display: none; }
    .login-user-item { padding: 10px 12px; cursor: pointer; font-size: .9rem; border-bottom: 1px solid var(--border); background: var(--surface); }
    .login-user-item:last-child { border-bottom: none; }
    .login-user-item:hover, .login-user-item:active { background: var(--bg); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: .9rem; font-weight: 600; transition: background .15s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--gray-900); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-full { width: 100%; }
    .btn-sm { padding: 6px 14px; font-size: .82rem; }

    label { display: block; font-size: .8rem; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; margin-top: 12px; }
    input[type=text], input[type=password], input[type=date], select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--gray-900); font-size: .9rem; outline: none; font-family: inherit; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    #login-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 300; }
    .login-card { background: var(--surface); border-radius: 16px; padding: 28px 24px; width: 100%; max-width: 340px; box-shadow: 0 4px 24px rgba(0,0,0,.12); }
    .login-card h2 { font-size: 1.3rem; margin-bottom: 4px; }
    .login-card p { font-size: .85rem; color: var(--gray-600); margin-bottom: 20px; }

    .dash-stat { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .dash-stat:last-child { border-bottom: none; }
    .dash-stat-icon { font-size: 1.4rem; width: 32px; text-align: center; }
    .dash-stat-label { font-size: .8rem; color: var(--gray-600); }
    .dash-stat-value { font-size: 1.05rem; font-weight: 700; }
    .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick-action-btn { flex: 1; min-width: 120px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--gray-900); font-size: .85rem; font-weight: 600; cursor: pointer; }
    .quick-action-btn:hover { background: var(--border); }

    .key-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .key-item:last-child { border-bottom: none; }
    .key-tag { background: var(--primary); color: #fff; border-radius: 6px; padding: 2px 8px; font-size: .75rem; font-weight: 700; min-width: 36px; text-align: center; }
    .key-meta { flex: 1; min-width: 0; }
    .key-name { font-size: .9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .key-sub { font-size: .75rem; color: var(--gray-600); }

    .log-item { padding: 9px 0; border-bottom: 1px solid var(--border); }
    .log-item:last-child { border-bottom: none; }
    .log-item-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
    .log-name { font-size: .9rem; font-weight: 600; }
    .log-time { font-size: .75rem; color: var(--gray-600); }
    .log-detail { font-size: .8rem; color: var(--gray-600); }
    .log-action-out { color: var(--orange); font-weight: 700; }
    .log-action-in { color: var(--primary); font-weight: 700; }

    .codes-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .codes-header-title { font-size: .82rem; font-weight: 600; color: var(--gray-600); }
    .codes-actions { display: flex; gap: 8px; }
    .code-section { margin-bottom: 10px; }
    .code-section-title { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--gray-600); margin-bottom: 2px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    .code-row { display: flex; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); gap: 8px; }
    .code-row:last-child { border-bottom: none; }
    .code-label { font-size: .78rem; color: var(--gray-600); width: 110px; flex-shrink: 0; }
    .code-value { font-size: .88rem; font-weight: 600; flex: 1; }
    .code-edit-input { flex: 1; padding: 4px 8px !important; font-size: .85rem !important; margin: 0 !important; width: auto !important; }
    .key-tag-row { padding: 6px 0; border-bottom: 1px solid var(--border); }
    .key-tag-row:last-child { border-bottom: none; }
    .missing-badge { font-size: .72rem; font-weight: 700; border-radius: 4px; padding: 2px 6px; flex-shrink: 0; }
    .missing-badge-warn { background: color-mix(in srgb, var(--orange) 15%, transparent); color: var(--orange); }
    .missing-badge-alert { background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red); }

    .user-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .user-item:last-child { border-bottom: none; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .9rem; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: .9rem; font-weight: 600; }
    .user-username { font-size: .75rem; color: var(--gray-600); }
    .user-role-badge { font-size: .68rem; font-weight: 700; border-radius: 4px; padding: 2px 6px; background: var(--bg); color: var(--gray-600); border: 1px solid var(--border); }

    .lockbox-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .lockbox-item:last-child { border-bottom: none; }
    .lockbox-sn { font-size: 1rem; font-weight: 700; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    .lockbox-status { display: inline-block; font-size: .7rem; font-weight: 700; border-radius: 4px; padding: 2px 7px; margin-bottom: 4px; }
    .lockbox-status-at-property { background: #e3f2fd; color: #1565c0; }
    .lockbox-status-in-office { background: #e8f5e9; color: #2e7d32; }
    .lockbox-status-unassigned { background: var(--bg); color: var(--gray-600); border: 1px solid var(--border); }
    @media (prefers-color-scheme: dark) {
      .lockbox-status-at-property { background: #0d2744; color: #90caf9; }
      .lockbox-status-in-office { background: #0d2a14; color: #a5d6a7; }
    }
    .lockbox-location { font-size: .78rem; color: var(--gray-600); margin-bottom: 6px; }
    .lockbox-code-display { background: var(--bg); border-radius: 8px; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; }
    .lockbox-code-val { font-size: 1.4rem; font-weight: 700; letter-spacing: 4px; color: var(--primary); font-variant-numeric: tabular-nums; }
    .lockbox-code-err { font-size: .72rem; color: var(--red); max-width: 180px; line-height: 1.3; }
    .lockbox-code-label { font-size: .7rem; color: var(--gray-600); text-align: right; }
    .lockbox-loading { color: var(--gray-400); font-size: .85rem; }

    /* Check-in list */
    .ci-key-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .ci-key-row:last-child { border-bottom: none; }
    .ci-key-info { flex: 1; min-width: 0; }
    .ci-key-name { font-size: .9rem; font-weight: 600; }
    .ci-key-prop { font-size: .75rem; color: var(--gray-600); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Photo capture */
    .photo-capture-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; border: 2px dashed var(--border); border-radius: 10px; background: var(--bg); color: var(--gray-600); font-size: .9rem; font-weight: 600; cursor: pointer; margin-top: 4px; transition: border-color .15s, color .15s; }
    .photo-capture-btn:hover { border-color: var(--primary); color: var(--primary); }
    .photo-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-top: 8px; display: none; border: 1px solid var(--border); }
    .photo-retake { font-size: .78rem; color: var(--gray-600); text-align: center; margin-top: 4px; cursor: pointer; text-decoration: underline; display: none; }

    /* AI verify result */
    .verify-result { border-radius: 8px; padding: 10px 12px; font-size: .85rem; line-height: 1.5; margin-top: 12px; }
    .verify-ok { background: color-mix(in srgb, var(--primary) 12%, transparent); border: 1px solid color-mix(in srgb, var(--primary) 35%, transparent); color: var(--primary-dark); }
    .verify-warn { background: color-mix(in srgb, var(--orange) 12%, transparent); border: 1px solid color-mix(in srgb, var(--orange) 35%, transparent); color: var(--orange); }
    .verify-skip { background: var(--surface-alt); border: 1px solid var(--border); color: var(--gray-600); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 400; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-card { background: var(--surface); border-radius: 16px; padding: 20px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; }
    .modal-card h3 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
    .modal-actions .btn { flex: 1; }

    .kw-info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .88rem; }
    .kw-info-label { color: var(--gray-600); font-size: .78rem; }
    .kw-info-val { font-weight: 700; }
    .kw-warning { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 10px 12px; font-size: .82rem; color: #5d4037; margin-top: 12px; line-height: 1.4; }
    @media (prefers-color-scheme: dark) { .kw-warning { background: #332900; border-color: #665500; color: #ffd54f; } }
    .modal-search-wrap { position: relative; }
    .modal-search-results, .search-results-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; max-height: 300px; overflow-y: auto; z-index: 10; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.12); }
    .modal-search-results .search-result-item { border-bottom: 1px solid var(--border); padding: 9px 14px; cursor: pointer; font-size: .9rem; }
    .modal-search-results .search-result-item:last-child { border-bottom: none; }
    .modal-search-results .search-result-item:hover { background: var(--bg); }

    .tag-picker-list { border: 1px solid var(--border); border-radius: 10px; max-height: 220px; overflow-y: auto; margin-top: 6px; }
    .tag-picker-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
    .tag-picker-item:last-child { border-bottom: none; }
    .tag-picker-item:hover, .tag-picker-item.selected { background: color-mix(in srgb, var(--primary) 10%, transparent); }
    .tag-picker-num { font-size: 1.1rem; font-weight: 800; min-width: 36px; color: var(--primary); font-variant-numeric: tabular-nums; }
    .tag-picker-types { font-size: .78rem; color: var(--gray-600); }
  </style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <h2>KRB Key Manager</h2>
    <p>Sign in to continue</p>
    <label>Username</label>
    <input type="text" id="login-username" autocomplete="off" autocapitalize="none" placeholder="tap to select or type" readonly
      onfocus="showLoginUserList()" onclick="showLoginUserList()" />
    <div class="login-user-list" id="login-user-list"></div>
    <label>PIN
      <input type="password" id="login-pin" autocomplete="current-password" inputmode="numeric" placeholder="••••" />
    </label>
    <div id="login-error" style="color:var(--red);font-size:.85rem;margin-top:8px;display:none"></div>
    <button class="btn btn-primary btn-full" style="margin-top:16px" onclick="doLogin()">Sign In</button>
  </div>
</div>

<header class="app-header" id="app-header" style="display:none">
  <div class="logo">
    <img src="/keyrenter-logo.png" alt="Keyrenter" onerror="this.style.display='none'" />
    <span>Key Manager</span>
  </div>
  <button class="user-pill" id="user-pill" onclick="openMoreSheet()">
    <span id="user-name-display"></span>
    <span class="role-badge" id="user-role-display"></span>
  </button>
</header>

<div class="sheet-overlay" id="more-overlay" onclick="closeMoreSheet()"></div>
<div class="bottom-sheet" id="more-sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-item" id="sheet-lockboxes" onclick="closeMoreSheet();showTab('lockboxes')">
    <span class="sheet-icon">🔒</span> Lockboxes
  </button>
  <button class="sheet-item" id="sheet-users" onclick="closeMoreSheet();showTab('users')">
    <span class="sheet-icon">👥</span> Users
  </button>
  <button class="sheet-item admin-only" onclick="closeMoreSheet();setTimeout(showSettingsModal,150)" style="display:none">
    <span class="sheet-icon">⚙️</span> Settings
  </button>
  <div class="sheet-divider"></div>
  <button class="sheet-item" onclick="closeMoreSheet();setTimeout(showChangePinModal,150)">
    <span class="sheet-icon">🔐</span> Change PIN
  </button>
  <button class="sheet-item" onclick="closeMoreSheet();doLogout()" style="color:var(--red)">
    <span class="sheet-icon">🚪</span> Sign Out
  </button>
</div>

<nav class="bottom-nav" id="bottom-nav" style="display:none">
  <button class="nav-btn active" data-tab="dashboard" onclick="showTab('dashboard')">
    <span class="nav-icon">🏠</span><span>Home</span>
  </button>
  <button class="nav-btn" data-tab="checkout" onclick="showTab('checkout')">
    <span class="nav-icon">📤</span><span>Out</span>
  </button>
  <button class="nav-btn" data-tab="checkin" onclick="showTab('checkin')">
    <span class="nav-icon">📥</span><span>In</span>
  </button>
  <button class="nav-btn" data-tab="codes" onclick="showTab('codes')">
    <span class="nav-icon">🔑</span><span>Codes</span>
  </button>
  <button class="nav-btn" data-tab="more" onclick="openMoreSheet()">
    <span class="nav-icon">⋯</span><span>More</span>
  </button>
</nav>

<div class="tab active" id="tab-dashboard">
  <div class="card">
    <h3>Key Inventory</h3>
    <div id="dash-stats"><div class="spinner"></div></div>
  </div>
  <div class="card">
    <h3 id="missing-keys-title">Missing Keys</h3>
    <div id="dash-missing"><div class="spinner"></div></div>
  </div>
  <div class="card">
    <h3>Quick Actions</h3>
    <div class="quick-actions">
      <button class="quick-action-btn" onclick="showReceiveKeysModal()">📥 Receive Keys</button>
      <button class="quick-action-btn" onclick="showAssignKeyTagModal()">🏷️ Assign Key Tag</button>
      <button class="quick-action-btn" onclick="showChangeKwiksetModal()">🔐 Change Kwikset</button>
      <button class="quick-action-btn" onclick="showChargeForKeysModal()">🔑 Charge for Keys</button>
      <button class="quick-action-btn admin-only" onclick="showRemovePropertyModal()" style="display:none">🏠 Remove Property</button>
    </div>
  </div>
  <div class="card">
    <h3>Recent Activity</h3>
    <div id="dash-log"><div class="spinner"></div></div>
  </div>
</div>

<div class="tab" id="tab-checkout">
  <div class="card">
    <h3>Check Out Key</h3>
    <label>Property</label>
    <div class="search-box">
      <input type="text" id="co-prop-search" placeholder="Search property…" oninput="searchProps('co')" onfocus="searchProps('co')" />
      <div class="search-results" id="co-prop-results"></div>
    </div>
    <div id="co-selected-prop" class="selected-prop" style="display:none"></div>
    <div id="co-key-select" style="display:none">
      <label>Key</label>
      <select id="co-key-dd"></select>
    </div>
    <div id="co-staff-select" style="display:none">
      <label>Staff</label>
      <select id="co-staff-dd"></select>
    </div>

<script>
const BASE = '';

async function api(path, opts = {}) {
  opts.headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  const res = await fetch(BASE + path, opts);
  if (res.status === 401) { showLogin(); throw new Error('Not authenticated'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function uploadPhoto(file) {
  const fd = new FormData();
  fd.append('photo', file);
  const res = await fetch('/api/upload-photo', { method: 'POST', body: fd });
  if (res.status === 401) { showLogin(); throw new Error('Not authenticated'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Upload failed');
  return data; // { fileId, url }
}

let loginUsers = [];
async function loadLoginUsers() {
  try { loginUsers = await fetch('/api/user-list').then(r => r.json()); } catch (_) { loginUsers = []; }
}
function showLoginUserList() {
  const list = document.getElementById('login-user-list');
  if (loginUsers.length === 0) { list.style.display = 'none'; return; }
  list.innerHTML = loginUsers.map((u, i) =>
    `<div class="login-user-item" data-idx="${i}">${u.name}<span style="color:var(--gray-400);font-size:.78rem;margin-left:6px">@${u.username}</span></div>`
  ).join('');
  list.querySelectorAll('.login-user-item').forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      const u = loginUsers[+el.dataset.idx];
      selectLoginUser(u.username, u.name);
    });
  });
  list.style.display = 'block';
}
function selectLoginUser(username) {
  document.getElementById('login-username').value = username;
  document.getElementById('login-user-list').style.display = 'none';
  document.getElementById('login-pin').focus();
}
document.addEventListener('click', e => {
  if (!e.target.closest('#login-username') && !e.target.closest('#login-user-list'))
    document.getElementById('login-user-list').style.display = 'none';
});

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-header').style.display = 'none';
  document.getElementById('bottom-nav').style.display = 'none';
  document.getElementById('login-username').value = '';
  document.getElementById('login-pin').value = '';
  currentUser = null; window.currentUser = null;
  loadLoginUsers();
}

async function initAuth() {
  loadLoginUsers();
  try {
    currentUser = await api('/api/me');
    window.currentUser = currentUser;
    onLogin(currentUser);
  } catch (_) { showLogin(); }
}

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const pin = document.getElementById('login-pin').value.trim();
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  if (!username || !pin) { err.textContent = 'Enter username and PIN'; err.style.display = 'block'; return; }
  try {
    const resp = await api('/api/login', { method: 'POST', body: JSON.stringify({ username, pin }) });
    const user = resp.user || resp;
    currentUser = user; window.currentUser = user;
    onLogin(user);
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
}

async function doLogout() {
  await api('/api/logout', { method: 'POST' }).catch(() => {});
  showLogin();
}

let currentUser = null;
window.currentUser = null;

function onLogin(user) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-header').style.display = 'flex';
  document.getElementById('bottom-nav').style.display = 'flex';
  document.getElementById('user-name-display').textContent = user.name;
  document.getElementById('user-role-display').textContent = user.role;
  showTab('dashboard');
  loadDashboard();
  const isAdminUser = (user.role || '').toLowerCase() === 'admin';
  document.querySelectorAll('.admin-only').forEach(el => { if (isAdminUser) el.style.display = ''; });
}

async function runSlackBackfill(btn) {
  const statusEl = btn?.closest('.modal-card')?.querySelector('#set-backfill-status');
  const origText = btn?.textContent || '📥 Sync Lockboxes from Slack';
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Starting…'; }
  if (statusEl) { statusEl.style.display = ''; statusEl.textContent = 'Starting sync…'; }
  try {
    const start = await api('/api/slack/backfill', { method: 'POST' });
    if (!start.started && !start.message) throw new Error(start.error || 'Failed to start backfill');
    let result;
    while (true) {
      await new Promise(r => setTimeout(r, 5000));
      result = await api('/api/slack/backfill/status');
      const prog = `Updated: ${result.updated} | Skipped: ${result.skipped} | Processed: ${result.total}`;
      if (btn) btn.textContent = `⏳ ${prog}`;
      if (statusEl) statusEl.textContent = prog;
      if (result.done) break;
    }
    if (result.error) throw new Error(result.error);
    const reasons = result.skipReasons && Object.keys(result.skipReasons).length
      ? '\n\nSkip reasons:\n' + Object.entries(result.skipReasons).map(([k,v]) => `  ${k}: ${v}`).join('\n')
      : '';
    const msg = `Sync complete!\n✅ Updated: ${result.updated}\n⏭ Skipped: ${result.skipped}\n🖼 With image: ${result.withImage || 0}\n📨 Total messages: ${result.total}${reasons}`;
    if (statusEl) statusEl.textContent = `✅ Done — Updated: ${result.updated}, Skipped: ${result.skipped}`;
    alert(msg);
  } catch (e) {
    if (statusEl) statusEl.textContent = '❌ ' + e.message;
    alert('Sync failed: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = origText; }
  }
}

function openMoreSheet() {
  document.getElementById('more-overlay').classList.add('open');
  document.getElementById('more-sheet').classList.add('open');
}
function closeMoreSheet() {
  document.getElementById('more-overlay').classList.remove('open');
  document.getElementById('more-sheet').classList.remove('open');
}

function showTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const tab = document.getElementById('tab-' + name);
  if (tab) tab.classList.add('active');
  const btn = document.querySelector(`.nav-btn[data-tab="${name}"]`);
  if (btn) btn.classList.add('active');
  if (name === 'checkin') loadCheckinKeys();
  if (name === 'lockboxes') loadLockboxes();
  if (name === 'users') loadUsers();
}

let propSearchTimers = {};
function searchProps(prefix) {
  const q = document.getElementById(prefix + '-prop-search').value.trim();
  const res = document.getElementById(prefix + '-prop-results');
  if (q.length < 2) { res.style.display = 'none'; return; }
  clearTimeout(propSearchTimers[prefix]);
  propSearchTimers[prefix] = setTimeout(async () => {
    try {
      const hits = await api('/api/search-properties?q=' + encodeURIComponent(q));
      if (!hits.length) { res.style.display = 'none'; return; }
      res.innerHTML = hits.slice(0, 8).map((p, i) =>
        `<div class="search-result-item" data-idx="${i}">${p.address || p.propertyCode}<div class="result-code">${p.propertyCode || ''}</div></div>`
      ).join('');
      res._hits = hits;
      res.querySelectorAll('.search-result-item').forEach(el => {
        el.addEventListener('mousedown', e => {
          e.preventDefault();
          const p = res._hits[+el.dataset.idx];
          res.style.display = 'none';
          document.getElementById(prefix + '-prop-search').value = '';
          selectProp(prefix, p.id, p.address || p.propertyCode);
        });
      });
      res.style.display = 'block';
    } catch (_) { res.style.display = 'none'; }
  }, 300);
}
function selectProp(prefix, id, name) {
  document.getElementById(prefix + '-prop-search').value = '';
  document.getElementById(prefix + '-prop-results').style.display = 'none';
  if (prefix === 'co') selectPropForCheckout(id, name);
  else if (prefix === 'codes') selectPropForCodes(id, name);
}

// ── Dashboard
async function loadDashboard() {
  const [keys, log, missing] = await Promise.all([
    api('/api/keys'),
    api('/api/log?limit=5'),
    api('/api/missing-keys').catch(() => []),
  ]);
  const available = keys.filter(k => k.status === 'Available').length;
  const out = keys.filter(k => k.status === 'Checked Out').length;
  document.getElementById('dash-stats').innerHTML = `
    <div class="dash-stat"><span class="dash-stat-icon">🗝️</span><div><div class="dash-stat-label">In Office</div><div class="dash-stat-value">${available}</div></div></div>
    <div class="dash-stat"><span class="dash-stat-icon">📤</span><div><div class="dash-stat-label">Checked Out</div><div class="dash-stat-value">${out}</div></div></div>
    <div class="dash-stat"><span class="dash-stat-icon">📋</span><div><div class="dash-stat-label">Total Keys</div><div class="dash-stat-value">${keys.length}</div></div></div>
  `;
  const missingTitle = document.getElementById('missing-keys-title');
  const missingEl = document.getElementById('dash-missing');
  if (missing.length === 0) {
    missingTitle.textContent = 'Missing Keys';
    missingEl.innerHTML = '<div class="empty" style="padding:12px 0">All keys accounted for ✓</div>';
  } else {
    missingTitle.innerHTML = `Missing Keys <span style="color:var(--red);font-weight:700">(${missing.length})</span>`;
    missingEl.innerHTML = missing.map((m, i) => {
      const days = m.daysOut != null ? m.daysOut : 0;
      const badgeClass = days > 3 ? 'missing-badge-alert' : 'missing-badge-warn';
      const badgeLabel = days === 0 ? 'Today' : `${days}d out`;
      return `<div class="key-item" data-missing-idx="${i}" style="cursor:pointer;border-radius:8px;transition:background .15s;" onmouseenter="this.style.background='var(--bg)'" onmouseleave="this.style.background=''"><span class="key-tag">${m.keyTag || '?'}</span><div class="key-meta"><div class="key-name">${m.propertyName || 'Unknown property'}</div><div class="key-sub">${m.staffName || 'Unknown'}${m.dateOut ? ' · ' + m.dateOut : ''}</div></div><span class="missing-badge ${badgeClass}">${badgeLabel}</span></div>`;
    }).join('');
    missingEl._missingData = missing;
    const roleLC = (currentUser?.role || '').toLowerCase();
    const canResolve = currentUser && (roleLC === 'admin' || roleLC.includes('manager'));
    missingEl.querySelectorAll('.key-item[data-missing-idx]').forEach(el => {
      if (!canResolve) { el.style.cursor = 'default'; el.onmouseenter = null; el.onmouseleave = null; return; }
      el.addEventListener('click', () => {
        const m = missingEl._missingData[+el.dataset.missingIdx];
        openResolveMissingModal(m);
      });
    });
  }
  document.getElementById('dash-log').innerHTML = log.length
    ? log.map(l => `<div class="log-item"><div class="log-item-header"><span class="log-name">${l.propertyName}</span><span class="log-time">${fmtTime(l.timestamp)}</span></div><div class="log-detail"><span class="log-action-${l.action === 'Check Out' ? 'out' : 'in'}">${l.action}</span> · ${l.staffName} · Key ${l.keyTag}</div></div>`).join('')
    : '<div class="empty">No recent activity</div>';
}
function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
}

// ── Kwikset modal
let _kwiksetOpts = null;
async function getKwiksetOptions() {
  if (!_kwiksetOpts) _kwiksetOpts = await api('/api/kwikset-options');
  return _kwiksetOpts;
}

async function showChangeKwiksetModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>🔐 Change Kwikset Cut</h3>

      <!-- Step 1: pick property + cut -->
      <div id="kw-step1">
        <label style="margin-top:0">Property</label>
        <div class="modal-search-wrap">
          <input type="text" id="kw-prop-input" placeholder="Search property…" autocomplete="off" />
          <div class="modal-search-results" id="kw-prop-results"></div>
        </div>
        <div id="kw-body" style="display:none">
          <div style="margin-top:10px;border:1px solid var(--border);border-radius:8px;overflow:hidden">
            <div class="kw-info-row" style="padding:8px 12px"><span class="kw-info-label">Property</span><span class="kw-info-val" id="kw-prop-name" style="font-size:.85rem"></span></div>
            <div class="kw-info-row" style="padding:8px 12px;border-bottom:none"><span class="kw-info-label">Current Kwikset</span><span class="kw-info-val" id="kw-current-name" style="color:var(--primary)"></span></div>
          </div>
          <label>Changing to</label>
          <select id="kw-new-select"></select>
          <div class="kw-warning" id="kw-warning" style="display:none"></div>
        </div>
        <div id="kw-loading" style="text-align:center;padding:16px 0;color:var(--gray-600);font-size:.88rem;display:none">Loading…</div>
        <div id="kw-error" style="color:var(--red);font-size:.85rem;margin-top:8px;display:none"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" id="kw-next-btn" onclick="kwiksetGoToStep2(this)" disabled>Next →</button>
        </div>
      </div>

      <!-- Step 2: keys + charge + invoice -->
      <div id="kw-step2" style="display:none">
        <div id="kw-step2-summary" style="border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px"></div>
        <label>Keys given to resident</label>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
          <input type="number" id="kw-num-keys" min="0" max="20" value="2" style="width:80px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:1rem" />
          <span style="font-size:.85rem;color:var(--gray-600)">keys</span>
        </div>
        <div id="kw-charge-breakdown" style="background:var(--surface-alt,#f8f8f8);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:.88rem;margin:10px 0"></div>
        <label style="margin-top:10px">Performed by</label>
        <input type="text" id="kw-performed-by" placeholder="Staff name…" style="margin-bottom:4px" />
        <label style="display:flex;align-items:center;gap:8px;font-weight:normal;margin-top:8px;cursor:pointer">
          <input type="checkbox" id="kw-include-base" checked style="width:auto;margin:0" />
          Include base charge
        </label>
        <label style="margin-top:10px">Bill to</label>
        <select id="kw-bill-to" style="margin-bottom:4px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:.95rem;width:100%">
          <option value="Resident">Resident</option>
          <option value="Landlord" selected>Landlord / Owner</option>
          <option value="KRB">KRB (Internal)</option>
        </select>
        <label style="display:flex;align-items:center;gap:8px;font-weight:normal;margin-top:6px;cursor:pointer">
          <input type="checkbox" id="kw-send-invoice" checked style="width:auto;margin:0" />
          Send invoice to Appfolio
        </label>
        <div id="kw-step2-error" style="color:var(--red);font-size:.85rem;margin-top:8px;display:none"></div>
        <div class="modal-actions">
          <button class="btn btn-outline" onclick="document.getElementById('kw-step1').style.display='';document.getElementById('kw-step2').style.display='none'">← Back</button>
          <button class="btn btn-primary" id="kw-save-btn" onclick="saveKwikset(this)">Confirm &amp; Save</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  let kwPropId = null, kwCurrentId = null, kwCurrentName = null, kwNewId = null, kwNewName = null, kwAddress = null, kwSearchTimer;
  let kwSettings = {};
  try { kwSettings = await api('/api/settings'); } catch (_) {}

  function updateChargeBreakdown() {
    const n = parseInt(overlay.querySelector('#kw-num-keys').value, 10) || 0;
    const includeBase = overlay.querySelector('#kw-include-base')?.checked ?? true;
    const base = parseFloat(kwSettings.kwiksetBaseCharge) || 0;
    const perKey = parseFloat(kwSettings.kwiksetPerKeyCharge) || 0;
    const total = (includeBase ? base : 0) + perKey * n;
    let html = '';
    if (includeBase) html += `<div style="display:flex;justify-content:space-between"><span>Base re-key charge</span><span>$${base.toFixed(2)}</span></div>`;
    html += `<div style="display:flex;justify-content:space-between"><span>Keys (${n} × $${perKey.toFixed(2)})</span><span>$${(perKey*n).toFixed(2)}</span></div>`;
    html += `<div style="display:flex;justify-content:space-between;font-weight:600;border-top:1px solid var(--border);margin-top:6px;padding-top:6px"><span>Total</span><span>$${total.toFixed(2)}</span></div>`;
    overlay.querySelector('#kw-charge-breakdown').innerHTML = html;
  }

  const propInput = overlay.querySelector('#kw-prop-input');
  const propResults = overlay.querySelector('#kw-prop-results');
  propInput.addEventListener('input', () => {
    const q = propInput.value.trim();
    propResults.style.display = 'none';
    if (q.length < 2) return;
    clearTimeout(kwSearchTimer);
    kwSearchTimer = setTimeout(async () => {
      try {
        const hits = await api('/api/search-properties?q=' + encodeURIComponent(q));
        if (!hits.length) return;
        propResults.innerHTML = hits.slice(0, 8).map((p, i) => `<div class="search-result-item" data-idx="${i}">${p.address || p.propertyCode}<div class="result-code">${p.propertyCode || ''}</div></div>`).join('');
        propResults._hits = hits;
        propResults.querySelectorAll('.search-result-item').forEach(el => {
          el.addEventListener('mousedown', async e => {
            e.preventDefault();
            const p = propResults._hits[+el.dataset.idx];
            propResults.style.display = 'none'; propInput.value = '';
            kwPropId = p.id; kwAddress = p.address || p.propertyCode;
            overlay.querySelector('#kw-loading').style.display = 'block';
            overlay.querySelector('#kw-body').style.display = 'none';
            overlay.querySelector('#kw-next-btn').disabled = true;
            try {
              const [opts, codes] = await Promise.all([getKwiksetOptions(), api('/api/property-codes/' + p.id)]);
              kwCurrentId = codes.kwiksetCutId || ''; kwCurrentName = codes.kwiksetCut || '— None —';
              kwAddress = codes.address || kwAddress;
              overlay.querySelector('#kw-prop-name').textContent = kwAddress;
              overlay.querySelector('#kw-current-name').textContent = kwCurrentName;
              const sel = overlay.querySelector('#kw-new-select');
              sel.innerHTML = `<option value="">— None —</option>` + opts.map(o => `<option value="${o.id}"${o.id === kwCurrentId ? ' selected' : ''}>${o.name}</option>`).join('');
              kwNewId = sel.value; kwNewName = sel.options[sel.selectedIndex]?.text;
              updateKwWarning(overlay, sel, kwCurrentName, kwCurrentId);
              sel.addEventListener('change', () => { kwNewId = sel.value; kwNewName = sel.options[sel.selectedIndex]?.text; updateKwWarning(overlay, sel, kwCurrentName, kwCurrentId); });
              overlay.querySelector('#kw-loading').style.display = 'none';
              overlay.querySelector('#kw-body').style.display = 'block';
              overlay.querySelector('#kw-next-btn').disabled = false;
            } catch (err) {
              overlay.querySelector('#kw-loading').style.display = 'none';
              overlay.querySelector('#kw-error').textContent = 'Error: ' + err.message;
              overlay.querySelector('#kw-error').style.display = 'block';
            }
          });
        });
        propResults.style.display = 'block';
      } catch (_) {}
    }, 300);
  });

  // expose state for step functions
  overlay._kwState = () => ({ kwPropId, kwCurrentId, kwNewId, kwNewName, kwAddress });
  overlay._updateCharge = updateChargeBreakdown;
  propInput.focus();
}

function updateKwWarning(overlay, sel, currentName, currentId) {
  const warning = overlay.querySelector('#kw-warning');
  const newVal = sel.value;
  const newName = sel.options[sel.selectedIndex]?.text || '— None —';
  if (!newVal && !currentId) { warning.style.display = 'none'; return; }
  warning.style.display = 'block';
  const previousNote = currentId ? ` The current cut (<strong>${currentName}</strong>) will be added to Previous Kwiksets.` : '';
  warning.innerHTML = `⚠️ This will set the Kwikset cut to <strong>${newName}</strong>.${previousNote}`;
}

function kwiksetGoToStep2(btn) {
  const overlay = btn.closest('.modal-overlay');
  const { kwPropId, kwNewId, kwNewName, kwAddress, kwCurrentId } = overlay._kwState();
  if (!kwPropId) return;
  // Populate step 2 summary
  overlay.querySelector('#kw-step2-summary').innerHTML =
    `<div class="kw-info-row" style="padding:8px 12px"><span class="kw-info-label">Property</span><span class="kw-info-val" style="font-size:.85rem">${kwAddress}</span></div>` +
    `<div class="kw-info-row" style="padding:8px 12px;border-bottom:none"><span class="kw-info-label">New Cut</span><span class="kw-info-val" style="color:var(--primary)">${kwNewName || '— None —'}</span></div>`;
  overlay._updateCharge();
  overlay.querySelector('#kw-num-keys').addEventListener('input', () => overlay._updateCharge());
  overlay.querySelector('#kw-include-base').addEventListener('change', () => overlay._updateCharge());
  overlay.querySelector('#kw-step1').style.display = 'none';
  overlay.querySelector('#kw-step2').style.display = '';
}

async function saveKwikset(btn) {
  const overlay = btn.closest('.modal-overlay');
  const { kwPropId, kwCurrentId, kwNewId, kwNewName, kwAddress } = overlay._kwState();
  if (!kwPropId) return;
  const numKeys = parseInt(overlay.querySelector('#kw-num-keys').value, 10) || 0;
  const performedBy = overlay.querySelector('#kw-performed-by').value.trim();
  const sendInvoice = overlay.querySelector('#kw-send-invoice').checked;
  const errEl = overlay.querySelector('#kw-step2-error'); errEl.style.display = 'none';

          api('/api/search-properties?q=' + encodeURIComponent(q)),
          api('/api/search-mf-codes?q=' + encodeURIComponent(q)),

            e.preventDefault();
            resultsEl.style.display = 'none';
            if (el.dataset.type === 'mf') {
              const m = resultsEl._mfHits[+el.dataset.idx];

              overlay.querySelector('#rp-prop-name').textContent = `${m.mfCode} — Common Area Keys`;
              bodyEl.style.display = '';
              checkRpReady();
            } else {
              const p = resultsEl._propHits[+el.dataset.idx];
              propInput.value = p.address || p.propertyCode;
              overlay._rpSelectProp(p.id, p.address || p.propertyCode);
            }
          });
        });

      } catch (e) { console.error('rp search error:', e); }

  function checkRpReady() {
    confirmBtn.disabled = !((rpPropId || rpMfCode) && photoInput.files.length > 0);
  }

  overlay._getRpState = () => ({ rpPropId, rpMfCode, rpMfPageId });
  propInput.focus();
}



async function confirmRemoveProperty(btn) {
  const overlay = btn.closest('.modal-overlay');
  const { rpPropId, rpMfCode, rpMfPageId } = overlay._getRpState();
  if (!rpPropId && !rpMfCode) return;
  const photoFile = overlay.querySelector('#rp-photo').files[0];
  if (!photoFile) { overlay.querySelector('#rp-error').textContent = 'Photo is required.'; overlay.querySelector('#rp-error').style.display = ''; return; }
  const givenTo = overlay.querySelector('input[name="rp-given-to"]:checked')?.value || 'Landlord';
  const propName = overlay.querySelector('#rp-prop-name').textContent;

  if (!confirm(`Remove "${propName}"?\n\nThis will:\n• Disassociate all linked keys from this property\n• Record the key return photo in Notion\n\nThis cannot be undone from the app.`)) return;

  const errEl = overlay.querySelector('#rp-error'); errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Removing…';

  const formData = new FormData();
  formData.append('givenTo', givenTo);
  formData.append('photo', photoFile);

  // Choose endpoint based on whether it's a regular property or an MF code
  const endpoint = rpMfCode ? '/api/remove-mf-code' : '/api/remove-property';
  if (rpMfCode) {
    formData.append('mfCode', rpMfCode);
    if (rpMfPageId) formData.append('mfPageId', rpMfPageId);
  } else {
    formData.append('propertyId', rpPropId);
  }

  try {
    const result = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('krb_token') || '') },
      body: formData,
    }).then(r => r.json());
    if (result.error) throw new Error(result.error);
    overlay.remove();
    alert(`✅ Done.\n${result.keysCleared} key(s) disassociated from property.\nKey return recorded in Notion.`);
    loadDashboard();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = '';
    btn.disabled = false; btn.textContent = 'Remove Property';
  }
}

  if (!propId) { errEl.textContent = 'Please select a property.'; errEl.style.display = ''; return; }
  const photoFile = photoInput.files[0];
  if (!photoFile) { errEl.textContent = 'A photo of the keys is required.'; errEl.style.display = ''; return; }

  btn.disabled = true;
  btn.textContent = 'Analyzing photo…';

  const formData = new FormData();
  formData.append('propertyId', propId);
  formData.append('photo', photoFile);

  try {
    const result = await fetch('/api/receive-keys', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('krb_token') || '') },
      body: formData,
    }).then(r => r.json());
    if (result.error) throw new Error(result.error);
    overlay.remove();
    alert(`✅ Keys received for ${result.address}\n\nAI Inventory:\n${result.aiDescription}`);
    loadDashboard();
  } catch (e) {
    errEl.textContent = e.message; errEl.style.display = '';
    btn.disabled = false; btn.textContent = 'Receive Keys';
  }
}

// ── Assign Key Tag modal ──────────────────────────────────────────────────────
async function showAssignKeyTagModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>🏷️ Assign Key Tag</h3>
      <p style="font-size:.85rem;color:var(--gray-600);margin-top:0">Link an available key tag to a property. A photo of the keys on the tag is required.</p>

        <input type="text" id="akt-filter" placeholder="Type a number to filter…" autocomplete="off" style="margin-bottom:8px" />
        <div id="akt-tag-list" class="tag-picker-list"><div style="padding:20px;text-align:center;color:var(--gray-400);font-size:.85rem">Loading…</div></div>
      </div>

      <div id="akt-step2" style="display:none">
        <div id="akt-selected-tag" style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--primary) 10%,transparent);border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);border-radius:10px;margin:8px 0 14px">
          <span style="font-size:1.3rem;font-weight:800;color:var(--primary)" id="akt-tag-num"></span>
          <span style="font-size:.82rem;color:var(--gray-600)" id="akt-tag-types"></span>
          <button onclick="document.getElementById('akt-step1').style.display='';document.getElementById('akt-step2').style.display='none';document.getElementById('akt-filter').focus();document.getElementById('akt-confirm-btn').disabled=true;" style="margin-left:auto;background:none;border:none;cursor:pointer;color:var(--gray-600);font-size:.85rem">Change</button>
        </div>
        <label>Property</label>
        <div class="modal-search-wrap">
          <input type="text" id="akt-prop-input" placeholder="Search property…" autocomplete="off" />
          <div class="modal-search-results" id="akt-prop-results"></div>
        </div>
        <div id="akt-prop-name" style="font-size:.85rem;font-weight:600;color:var(--primary);margin:6px 0 0;display:none"></div>
        <label>Photo of keys on tag <span style="color:var(--red)">*</span></label>
        <input type="file" id="akt-photo" accept="image/*" capture="environment" style="margin-bottom:4px" />
        <div id="akt-photo-preview" style="margin-bottom:8px"></div>
      </div>

      <div id="akt-error" style="color:var(--red);font-size:.85rem;margin-top:8px;display:none"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
        <button class="btn btn-primary" id="akt-confirm-btn" onclick="confirmAssignKeyTag(this)" disabled>Assign Tag</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  let aktKeyId = null, aktPropId = null;
  let aktSearchTimer;
  const filterInput = overlay.querySelector('#akt-filter');
  const tagListEl = overlay.querySelector('#akt-tag-list');
  const step1 = overlay.querySelector('#akt-step1');
  const step2 = overlay.querySelector('#akt-step2');
  const propInput = overlay.querySelector('#akt-prop-input');
  const propResults = overlay.querySelector('#akt-prop-results');
  const propNameEl = overlay.querySelector('#akt-prop-name');
  const photoInput = overlay.querySelector('#akt-photo');
  const photoPreview = overlay.querySelector('#akt-photo-preview');
  const confirmBtn = overlay.querySelector('#akt-confirm-btn');

  function checkReady() {
    confirmBtn.disabled = !(aktKeyId && aktPropId && photoInput.files.length > 0);
  }

  // Load available tags
  let allTags = [];
  try {
    allTags = await api('/api/available-key-tags');
  } catch (e) {
    tagListEl.innerHTML = `<div style="padding:16px;color:var(--red);font-size:.85rem">Failed to load tags: ${e.message}</div>`;
    return;
  }

  function renderTags(filter) {
    const q = (filter || '').trim();
    const filtered = q ? allTags.filter(t => t.tag.includes(q)) : allTags;
    if (!filtered.length) {
      tagListEl.innerHTML = `<div style="padding:20px;text-align:center;color:var(--gray-400);font-size:.85rem">${q ? 'No matching tags' : 'No available tags'}</div>`;
      return;
    }
    tagListEl.innerHTML = filtered.map((t, i) =>
      `<div class="tag-picker-item" data-idx="${i}" data-id="${t.id}" data-tag="${t.tag}" data-types="${(t.keyTypes||[]).join(', ')}">
        <span class="tag-picker-num">${t.tag}</span>
        <span class="tag-picker-types">${(t.keyTypes||[]).join(', ') || 'No key types set'}</span>
      </div>`
    ).join('');
    tagListEl.querySelectorAll('.tag-picker-item').forEach(el => {
      el.addEventListener('click', () => {
        aktKeyId = el.dataset.id;
        overlay._aktKeyId = aktKeyId;
        overlay.querySelector('#akt-tag-num').textContent = `Tag ${el.dataset.tag}`;
        overlay.querySelector('#akt-tag-types').textContent = el.dataset.types || '';
        step1.style.display = 'none';
        step2.style.display = '';
        propInput.focus();
        checkReady();
      });
    });
  }

  renderTags('');
  filterInput.addEventListener('input', () => renderTags(filterInput.value));
  filterInput.focus();

  // Property search
  propInput.addEventListener('input', () => {
    clearTimeout(aktSearchTimer);
    aktSearchTimer = setTimeout(async () => {
      const q = propInput.value.trim();
      propResults.style.display = 'none';
      if (q.length < 2) return;
      try {
        const hits = await api('/api/search-properties?q=' + encodeURIComponent(q));
        if (!hits.length) return;
        propResults.innerHTML = hits.slice(0, 8).map((p, i) =>
          `<div class="search-result-item" data-idx="${i}">${p.address || p.propertyCode}<div class="result-code">${p.propertyCode || ''}</div></div>`
        ).join('');
        propResults._hits = hits;
        propResults.querySelectorAll('.search-result-item').forEach(el => {
          el.addEventListener('mousedown', e => {
            e.preventDefault();
            const p = propResults._hits[+el.dataset.idx];
            propResults.style.display = 'none';
            propInput.value = '';
            aktPropId = p.id;
            overlay._aktPropId = p.id;
            propNameEl.textContent = p.address || p.propertyCode;
            propNameEl.style.display = '';
            checkReady();
          });
        });
        propResults.style.display = 'block';
      } catch (e) { console.warn('property search error', e); }
    }, 300);
  });

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    photoPreview.innerHTML = file
      ? `<img src="${URL.createObjectURL(file)}" style="max-width:100%;max-height:180px;border-radius:8px;margin-top:4px;border:1px solid var(--border)">`
      : '';
    checkReady();
  });
}

let coSelectedProp = null;
async function selectPropForCheckout(id, name) {
  coSelectedProp = { id, name };
  document.getElementById('co-selected-prop').style.display = 'flex';
  document.getElementById('co-selected-prop').innerHTML = `<span>${name}</span><button onclick="clearPropSelection('co')">✕</button>`;

function onCoPhotoSelected() {
  const file = document.getElementById('co-photo-input').files[0];

  const preview = document.getElementById('co-photo-preview');
  const retake = document.getElementById('co-photo-retake');

async function doCheckout() {

function openResolveMissingModal(m) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;';
  const sheet = document.createElement('div');
  sheet.style.cssText = 'background:var(--surface);border-radius:16px 16px 0 0;padding:24px 16px 32px;width:100%;max-width:480px;';
  const days = m.daysOut != null ? m.daysOut : 0;
  sheet.innerHTML = `
    <div style="font-size:1.05rem;font-weight:700;margin-bottom:4px;">Resolve Missing Key</div>
    <div style="font-size:.85rem;color:var(--gray-600);margin-bottom:16px;">Key ${m.keyTag || '?'} · ${m.propertyName || 'Unknown'} · ${days}d out</div>

      <button id="resolve-lost-btn" style="padding:14px;border:none;border-radius:10px;background:var(--red);color:#fff;font-size:.95rem;font-weight:700;cursor:pointer;">⚠️ Mark as Lost</button>
      <button id="resolve-cancel-btn" style="padding:12px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--gray-600);font-size:.9rem;cursor:pointer;">Cancel</button>
    </div>
  `;
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);

  const msg = sheet.querySelector('#resolve-msg');

  async function doResolve(resolution) {
    const btn = sheet.querySelector(resolution === 'returned' ? '#resolve-returned-btn' : '#resolve-lost-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      await api('/api/resolve-missing', { method: 'POST', body: JSON.stringify({ logId: m.id, keyId: m.keyId, resolution }) });
      overlay.remove();
      loadDashboard();
    } catch (e) {

  sheet.querySelector('#resolve-lost-btn').addEventListener('click', () => doResolve('lost'));

function openCheckinModal(key) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>📥 Check In Key</h3>
      <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);margin-bottom:12px">
        <span class="key-tag">${key.tag}</span>
        <div>
          <div style="font-weight:600;font-size:.9rem">${key.name}</div>
          <div style="font-size:.75rem;color:var(--gray-600)">${key.propertyName || '—'}</div>
        </div>
      </div>
      <label style="margin-top:0">📷 Photo of keys being returned</label>
      <label class="photo-capture-btn" for="ci-photo-input-modal">📷 Take Photo</label>
      <input type="file" id="ci-photo-input-modal" accept="image/*" capture="environment" style="display:none" />
      <img id="ci-photo-preview-modal" class="photo-preview" alt="Return photo" />
      <div class="photo-retake" id="ci-photo-retake-modal" onclick="document.getElementById('ci-photo-input-modal').click()">Retake photo</div>
      <div id="ci-verify-result" style="display:none"></div>
      <div id="ci-modal-error" style="color:var(--red);font-size:.82rem;margin-top:8px;display:none"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
        <button class="btn btn-primary" id="ci-submit-btn" disabled>Verify &amp; Check In</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  const photoInput = overlay.querySelector('#ci-photo-input-modal');
  const photoPreview = overlay.querySelector('#ci-photo-preview-modal');
  const retakeBtn = overlay.querySelector('#ci-photo-retake-modal');
  const submitBtn = overlay.querySelector('#ci-submit-btn');
  let selectedFile = null;

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (!file) return;
    selectedFile = file;
    const reader = new FileReader();
    reader.onload = e => { photoPreview.src = e.target.result; photoPreview.style.display = 'block'; retakeBtn.style.display = 'block'; };
    reader.readAsDataURL(file);
    submitBtn.disabled = false;
  });

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    const errEl = overlay.querySelector('#ci-modal-error');
    const resultEl = overlay.querySelector('#ci-verify-result');
    errEl.style.display = 'none';
    resultEl.style.display = 'none';
    submitBtn.disabled = true; submitBtn.textContent = 'Uploading…';
    try {
      const { fileId } = await uploadPhoto(selectedFile);
      submitBtn.textContent = 'Verifying with AI…';
      let verifyResult;
      try {
        verifyResult = await api('/api/verify-checkin-photo', { method: 'POST', body: JSON.stringify({ keyId: key.id, checkInFileId: fileId }) });
      } catch (_) {
        verifyResult = { skipped: true, message: 'AI verification unavailable' };
      }
      resultEl.style.display = 'block';
      if (verifyResult.skipped) {
        resultEl.innerHTML = `<div class="verify-result verify-skip">ℹ️ ${verifyResult.message}</div>`;
        await finalizeCheckin(key.id, fileId, overlay, submitBtn);
      } else if (verifyResult.match === false) {
        resultEl.innerHTML = `<div class="verify-result verify-warn">⚠️ <strong>Keys may not match</strong><br><span style="font-size:.82rem">${verifyResult.notes || 'AI detected a possible discrepancy.'}</span></div>`;
        submitBtn.disabled = false; submitBtn.textContent = 'Override &amp; Check In';
        submitBtn.onclick = () => finalizeCheckin(key.id, fileId, overlay, submitBtn);
      } else {
        resultEl.innerHTML = `<div class="verify-result verify-ok">✅ Keys verified — same keys confirmed${verifyResult.notes ? '<br><span style="font-size:.8rem">' + verifyResult.notes + '</span>' : ''}</div>`;
        await finalizeCheckin(key.id, fileId, overlay, submitBtn);
      }
    } catch (e) {
      errEl.textContent = e.message; errEl.style.display = 'block';
      submitBtn.disabled = false; submitBtn.textContent = 'Verify &amp; Check In';
    }
  });
}

async function finalizeCheckin(keyId, checkInFileId, overlay, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Checking in…'; }
  try {
    await api('/api/checkin', { method: 'POST', body: JSON.stringify({ keyId, checkInFileId }) });
    overlay.remove();
    loadCheckinKeys();
    loadDashboard();
  } catch (e) {
    const errEl = overlay.querySelector('#ci-modal-error');
    if (errEl) { errEl.textContent = 'Check in failed: ' + e.message; errEl.style.display = 'block'; }
    if (btn) { btn.disabled = false; btn.textContent = 'Try Again'; }
  }
}

// ── Codes
let codesCurrentPropertyId = null, codesCurrentData = null, codesEditMode = false, kwiksetOptions = null;
async function selectPropForCodes(id, name) {
  codesCurrentPropertyId = id; codesEditMode = false; kwiksetOptions = null;
  const label = document.getElementById('codes-selected-prop');
  label.textContent = name; label.style.display = 'block';
  document.getElementById('codes-content').innerHTML = '<div class="spinner"></div>';

    const data = await api('/api/property-codes/' + id);
    codesCurrentData = data; renderCodes(data);
  } catch (e) { document.getElementById('codes-content').innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}
function viewRow(label, value) {
  return `<div class="code-row"><span class="code-label">${label}</span><span class="code-value">${value || '<span style="color:var(--gray-400)">—</span>'}</span></div>`;
}
function editRow(label, field, value) {
  return `<div class="code-row"><span class="code-label">${label}</span><input type="text" id="edit-${field}" class="code-edit-input" inputmode="numeric" value="${(value||'').replace(/"/g,'&quot;')}" /></div>`;
}
function kwiksetSelectRow(currentId, options) {
  const opts = (options || []).map(o => `<option value="${o.id}"${o.id === currentId ? ' selected' : ''}>${o.name}</option>`).join('');
  return `<div class="code-row"><span class="code-label">Kwikset Cut</span><select id="edit-kwiksetCut" class="code-edit-input" style="padding:3px 6px !important"><option value="">— none —</option>${opts}</select></div>`;
}
function renderCodes(data) {
  if (data) codesCurrentData = data;
  const d = codesCurrentData;
  const keys = d.keys || [];
  let html = codesEditMode
    ? `<div class="codes-header"><span class="codes-header-title">Editing…</span><div class="codes-actions"><button class="btn btn-outline btn-sm" onclick="cancelEditCodes()">Cancel</button><button class="btn btn-primary btn-sm" id="codes-save-btn" onclick="saveAllCodes()">Save</button></div></div>`
    : `<div class="codes-header"><span class="codes-header-title">&nbsp;</span><button class="btn btn-outline btn-sm" onclick="startEditCodes()">✏️ Edit</button></div>`;
  html += '<div class="code-section"><div class="code-section-title">Entry Codes</div>';
  html += codesEditMode ? editRow('Front Door','frontDoorCode',d.frontDoorCode) : viewRow('Front Door',d.frontDoorCode);
  html += codesEditMode ? editRow('Garage Keypad','garageKeypad',d.garageKeypad) : viewRow('Garage Keypad',d.garageKeypad);
  html += codesEditMode ? editRow('Community Entry','communityEntryCode',d.communityEntryCode) : viewRow('Community Entry',d.communityEntryCode);
  html += codesEditMode ? kwiksetSelectRow(d.kwiksetCutId, kwiksetOptions) : viewRow('Kwikset Cut', d.kwiksetCut);
  html += '</div><div class="code-section"><div class="code-section-title">Key Tags</div>';
  if (keys && keys.length) {
    keys.forEach(k => { html += `<div class="key-tag-row" style="display:flex;align-items:center;gap:8px"><span class="key-tag">${k.tag || '?'}</span><span style="font-size:.82rem;color:var(--gray-600)">${(k.keyTypes||[]).join(', ')}</span></div>`; });
  } else { html += '<div class="empty" style="padding:8px 0">No keys linked</div>'; }
  html += '</div>';
  document.getElementById('codes-content').innerHTML = html;
}
async function startEditCodes() {
  codesEditMode = true;
  if (!kwiksetOptions) { try { kwiksetOptions = await api('/api/kwikset-options'); } catch (_) { kwiksetOptions = []; } }
  renderCodes();
}
function cancelEditCodes() { codesEditMode = false; renderCodes(); }
async function saveAllCodes() {
  if (!codesCurrentPropertyId) return;
  const saveBtn = document.getElementById('codes-save-btn');
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }
  try {
    for (const field of ['frontDoorCode','garageKeypad','communityEntryCode']) {
      const input = document.getElementById('edit-' + field);
      if (input) await api(`/api/property-codes/${codesCurrentPropertyId}`, { method: 'PATCH', body: JSON.stringify({ field, value: input.value }) });
    }
    const kwiksetSelect = document.getElementById('edit-kwiksetCut');
    if (kwiksetSelect) {
      await api(`/api/property-kwikset/${codesCurrentPropertyId}`, { method: 'PATCH', body: JSON.stringify({ kwiksetPageId: kwiksetSelect.value || null, previousKwiksetId: codesCurrentData?.kwiksetCutId || null }) });
    }
    codesEditMode = false;
    const data = await api('/api/property-codes/' + codesCurrentPropertyId);
    codesCurrentData = data; renderCodes(data);
  } catch (e) { alert('Save failed: ' + e.message); if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Save'; } }
}

// ── Lockboxes
function lockboxStatusClass(status) {
  if (!status) return 'lockbox-status-unassigned';
  const s = status.toLowerCase().replace(/\s+/g, '-');
  if (s === 'at-property') return 'lockbox-status-at-property';
  if (s === 'in-office') return 'lockbox-status-in-office';
  return 'lockbox-status-unassigned';
}
let allLockboxes = [];

function renderLockboxes(boxes) {
  const el = document.getElementById('lockbox-list');
  if (!boxes.length) { el.innerHTML = '<div class="empty">No lockboxes match</div>'; return; }
  el.innerHTML = boxes.map(b => `
    <div class="lockbox-item">
      <div class="lockbox-sn">SN: ${b.sn}</div>
      <div><span class="lockbox-status ${lockboxStatusClass(b.status)}">${b.status || 'Unassigned'}</span></div>
      <div class="lockbox-location">${b.propertyName || '— No location assigned —'}</div>
      <div class="lockbox-code-display">
        <div id="lbcode-wrap-${b.id}"><div class="lockbox-code-val" id="lbcode-${b.id}"><span class="lockbox-loading">Loading…</span></div></div>
        <div class="lockbox-code-label">Today's<br>Code</div>
      </div>
    </div>`).join('');
  boxes.forEach(b => {
    if (!document.getElementById('lbcode-' + b.id)) return;
    api('/api/lockbox-code/' + b.id)
      .then(r => { const el = document.getElementById('lbcode-' + b.id); if (el) el.textContent = r.code || '—'; })
      .catch(e => { const w = document.getElementById('lbcode-wrap-' + b.id); if (w) w.innerHTML = `<div class="lockbox-code-err">${e.message}</div>`; });
  });
}

function filterLockboxes(q) {
  const term = q.trim().toLowerCase();
  const filtered = term ? allLockboxes.filter(b =>
    (b.sn || '').toLowerCase().includes(term) ||
    (b.propertyName || '').toLowerCase().includes(term)
  ) : allLockboxes;
  renderLockboxes(filtered);
}

async function loadLockboxes() {
  const el = document.getElementById('lockbox-list');
  const search = document.getElementById('lockbox-search');
  if (search) search.value = '';
  el.innerHTML = '<div class="spinner"></div>';
  try {
    allLockboxes = await api('/api/lockboxes');
    if (!allLockboxes.length) { el.innerHTML = '<div class="empty">No lockboxes found</div>'; return; }
    renderLockboxes(allLockboxes);
  } catch (e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

// ── Users
const USER_ROLES = ['Admin', 'Property Manager', 'Field Manager', 'Member'];

async function loadUsers() {
  const el = document.getElementById('user-list');
  el.innerHTML = '<div class="spinner"></div>';
  try {
    const users = await api('/api/users');
    const isAdmin = currentUser && (currentUser.role || '').toLowerCase() === 'admin';
    if (!users.length) { el.innerHTML = '<div class="empty">No users found</div>'; return; }
    el.innerHTML = users.map((u, i) => {
      const badge = isAdmin
        ? `<span class="user-role-badge" data-user-idx="${i}" style="cursor:pointer;text-decoration:underline dotted;">${u.role} ✎</span>`
        : `<span class="user-role-badge">${u.role}</span>`;
      return `<div class="user-item"><div class="user-avatar">${u.name.charAt(0).toUpperCase()}</div><div class="user-info"><div class="user-name">${u.name}</div><div class="user-username">@${u.username}</div></div>${badge}</div>`;
    }).join('');
    el._usersData = users;
    if (isAdmin) {
      el.querySelectorAll('.user-role-badge[data-user-idx]').forEach(badge => {
        badge.addEventListener('click', () => {
          const u = el._usersData[+badge.dataset.userIdx];
          openRolePickerSheet(u, () => loadUsers());
        });
      });
    }
  } catch (e) { el.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

function openRolePickerSheet(user, onDone) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;';
  const sheet = document.createElement('div');
  sheet.style.cssText = 'background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px 32px;width:100%;max-width:480px;';
  sheet.innerHTML = `
    <div style="font-size:1rem;font-weight:700;margin-bottom:4px;">Change Role</div>
    <div style="font-size:.85rem;color:var(--gray-600);margin-bottom:16px;">${user.name} (@${user.username})</div>
    <div id="role-pick-msg" style="display:none;border-radius:8px;padding:10px;font-size:.85rem;margin-bottom:12px;"></div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${USER_ROLES.map(role => `
        <button class="role-pick-btn" data-role="${role}" style="padding:13px 16px;border:2px solid ${role === user.role ? 'var(--primary)' : 'var(--border)'};border-radius:10px;background:${role === user.role ? '#e8f5e9' : 'transparent'};color:var(--gray-900);font-size:.92rem;font-weight:${role === user.role ? '700' : '500'};text-align:left;cursor:pointer;">
          ${role}${role === user.role ? ' ✓' : ''}
        </button>`).join('')}
      <button id="role-cancel-btn" style="padding:11px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--gray-600);font-size:.9rem;cursor:pointer;margin-top:4px;">Cancel</button>
    </div>
  `;
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);

  const msg = sheet.querySelector('#role-pick-msg');

  sheet.querySelectorAll('.role-pick-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const newRole = btn.dataset.role;
      if (newRole === user.role) { overlay.remove(); return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await api(`/api/users/${user.id}`, { method: 'PATCH', body: JSON.stringify({ role: newRole }) });
        overlay.remove();
        onDone();
      } catch (e) {
        msg.style.cssText = 'display:block;background:color-mix(in srgb,#e53935 12%,transparent);border:1px solid color-mix(in srgb,#e53935 35%,transparent);color:var(--red);border-radius:8px;padding:10px;font-size:.85rem;margin-bottom:12px;';
        msg.textContent = e.message || 'Failed to update role';
        btn.disabled = false; btn.textContent = newRole;
      }
    });
  });

  sheet.querySelector('#role-cancel-btn').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

// ── Change PIN
function showChangePinModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-card">
      <h3>Change PIN</h3>
      <label>Current PIN</label><input type="password" id="pin-current" inputmode="numeric" placeholder="••••" />
      <label>New PIN</label><input type="password" id="pin-new" inputmode="numeric" placeholder="••••" />
      <label>Confirm New PIN</label><input type="password" id="pin-confirm" inputmode="numeric" placeholder="••••" />
      <div id="pin-error" style="color:var(--red);font-size:.85rem;margin-top:8px;display:none"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="doChangePin(this)">Save</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#pin-current').focus();
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}
async function doChangePin(btn) {
  const current = document.getElementById('pin-current').value;
  const newPin = document.getElementById('pin-new').value;
  const confirm = document.getElementById('pin-confirm').value;
  const err = document.getElementById('pin-error');
  if (newPin !== confirm) { err.textContent = 'PINs do not match'; err.style.display = 'block'; return; }
  if (newPin.length < 4) { err.textContent = 'PIN must be at least 4 digits'; err.style.display = 'block'; return; }
  btn.disabled = true;
  try {
    await api('/api/change-pin', { method: 'POST', body: JSON.stringify({ currentPin: current, newPin }) });
    btn.closest('.modal-overlay').remove();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; btn.disabled = false; }
}

initAuth();
</script>
